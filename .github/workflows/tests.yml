on:
  workflow_dispatch:
  push:
  pull_request:
name: tests
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.sha || '' }}
  cancel-in-progress: true
jobs:
  # Run unit tests
  tests:
    name: "py-${{ matrix.python-version }}, ${{ matrix.os }}"
    # Skip same-repo PR runs: the push event already covers them.
    if: &skip_same_repo_pr github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.14" }
          - { os: ubuntu-24.04, python-version: "3.8" }  # no 3.8 build for newer Ubuntu
          - { os: macos-26, python-version: "3.14" }
          - { os: windows-2025, python-version: "3.14" }

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Tests
        run: make ci-test

  # Run linters
  linters:
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - name: 'Run linters'
      run: make ci-lint

  # Check source distribution
  check-sdist:
    if: *skip_same_repo_pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Check source distribution
        run: make ci-check-dist
